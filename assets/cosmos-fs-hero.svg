        <path d="M15.045,7.815c0-.015,0-.03-.007-.044a5.978,5.978,0,0,0-1.406-2.88,1.825,1.825,0,0,0-.289-.09,1.806,1.806,0,0,0-2.3,1.663,2,2,0,0,0-.2-.013,1.737,1.737,0,0,0-.581,3.374,1.451,1.451,0,0,0,.541.1h2.03A13.453,13.453,0,0,0,15.045,7.815Z" fill="#f2f2f2"/>
      </g>
    </g>
    <path d="M17.191,3.832c-.629-1.047-2.1-1.455-4.155-1.149a14.606,14.606,0,0,0-2.082.452,6.456,6.456,0,0,1,1.528.767c.241-.053.483-.116.715-.151A7.49,7.49,0,0,1,14.3,3.662a2.188,2.188,0,0,1,1.959.725h0c.383.638.06,1.729-.886,3a16.723,16.723,0,0,1-4.749,4.051A16.758,16.758,0,0,1,4.8,13.7c-1.564.234-2.682,0-3.065-.636s-.06-1.73.886-2.995c.117-.157.146-.234.279-.392a6.252,6.252,0,0,1,.026-1.63A11.552,11.552,0,0,0,1.756,9.419C.517,11.076.181,12.566.809,13.613a3.165,3.165,0,0,0,2.9,1.249,8.434,8.434,0,0,0,1.251-.1,17.855,17.855,0,0,0,6.219-2.4,17.808,17.808,0,0,0,5.061-4.332C17.483,6.369,17.819,4.88,17.191,3.832Z" fill="#50e6ff"/>
  </svg>
  <g transform="translate(560,140)" text-anchor="middle">
    <text x="0" y="230" fill="#e6edf3" font-size="19" font-weight="700">Azure Cosmos DB</text>
  </g>

  <!-- link B~C: cosmos-fs is a live, read-only lens onto the container -->
  <g>
    <circle cx="638" cy="238" r="3.2" fill="#3fb950"/>
    <path d="M644 238 H708" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.85"/>
    <path d="M740 238 H814" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.85"/>
    <!-- eye = read-only view / lens -->
    <path d="M712 238 Q724 228 736 238 Q724 248 712 238 Z" fill="none" stroke="#3fb950" stroke-width="1.8"/>
    <circle cx="724" cy="238" r="3.4" fill="#3fb950"/>
    <text x="724" y="266" text-anchor="middle" fill="#8b949e" font-size="12">read-only view</text>
  </g>

  <!-- ===================== BEAT C: explore like a folder ===================== -->
  <g transform="translate(820,140)">
    <g filter="url(#hsoft)"><rect x="0" y="0" width="360" height="196" rx="12" fill="#0d1117" stroke="#30363d"/></g>
    <!-- title bar -->
    <path d="M0 12 a12 12 0 0 1 12 -12 H348 a12 12 0 0 1 12 12 V34 H0 Z" fill="#161b22" stroke="#30363d"/>
    <circle cx="20" cy="17" r="5" fill="#f85149"/><circle cx="40" cy="17" r="5" fill="#d29922"/><circle cx="60" cy="17" r="5" fill="#3fb950"/>
    <!-- cosmos-fs logo lockup, centered in title bar -->
    <g>
      <rect x="133" y="8" width="18" height="18" rx="5" fill="#1f6feb"/>
      <path d="M138 12.5 L143 17 L138 21.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="143.5" y="20" width="4.75" height="1.7" rx="0.85" fill="#fff"/>
      <text x="157" y="21" fill="#e6edf3" font-size="13" font-weight="700">cosmos-fs</text>
    </g>
    <!-- body -->
    <g font-size="13.5">
      <text x="18" y="66" fill="#3fb950">$ <tspan fill="#e6edf3">grep -rl "reset password" .</tspan></text>
      <text x="30" y="90" fill="#8b949e">guide/authentication.md</text>
      <text x="18" y="120" fill="#3fb950">$ <tspan fill="#e6edf3">cat guide/authentication.md</tspan></text>
      <text x="30" y="144" fill="#8b949e">"Open Settings, then Reset password..."</text>
    </g>
    <path d="M18 168 l5 5 l9 -11" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="174" fill="#58a6ff" font-size="13.5">answered, cited from your docs</text>

    <text x="180" y="230" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Explore like a folder</text>
    <text x="180" y="252" text-anchor="middle" fill="#8b949e" font-size="13">ls · cd · find · cat · grep</text>
  </g>
</svg>
