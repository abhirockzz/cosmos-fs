<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 110 1240 300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="cosmos-fs: explore an Azure Cosmos DB container like a folder of files">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <marker id="harr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/></marker>
    <filter id="hsoft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <radialGradient id="cdbg" cx="-105.006" cy="-10.409" r="5.954" gradientTransform="translate(117.739 19.644) scale(1.036 1.027)" gradientUnits="userSpaceOnUse"><stop offset="0.183" stop-color="#5ea0ef"/><stop offset="1" stop-color="#0078d4"/></radialGradient>
    <clipPath id="cdbclip"><path d="M14.969,7.53A6.137,6.137,0,1,1,7.574,2.987,6.137,6.137,0,0,1,14.969,7.53Z" fill="none"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="420" fill="url(#hbg)"/>

  <!-- ===================== BEAT A: your documents ===================== -->
  <g transform="translate(60,140)">
    <g filter="url(#hsoft)"><rect x="0" y="0" width="240" height="196" rx="16" fill="#161b22" stroke="#30363d"/></g>
    <text x="20" y="34" fill="#8b949e" font-size="13">./docs</text>

    <!-- overview.md -->
    <g transform="translate(24,50)"><path d="M0 0 H9 L14 5 V17 H0 Z" fill="#21262d" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 0 V5 H14" fill="none" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/></g>
    <text x="48" y="64" fill="#e6edf3" font-size="15">overview.md</text>

    <!-- faq.md -->
    <g transform="translate(24,82)"><path d="M0 0 H9 L14 5 V17 H0 Z" fill="#21262d" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 0 V5 H14" fill="none" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/></g>
    <text x="48" y="96" fill="#e6edf3" font-size="15">faq.md</text>

    <!-- guide/ folder -->
    <g transform="translate(23,115)"><path d="M0 3 H5 L7 1 H14.5 a1.5 1.5 0 0 1 1.5 1.5 V12 a1 1 0 0 1 -1 1 H1 a1 1 0 0 1 -1 -1 Z" fill="#1f6feb" stroke="#58a6ff" stroke-width="1"/></g>
    <text x="48" y="128" fill="#e6edf3" font-size="15">guide/</text>

    <!-- nested file -->
    <path d="M42 146 V162 H50" fill="none" stroke="#30363d" stroke-width="1.4"/>
    <g transform="translate(56,147)"><path d="M0 0 H9 L14 5 V17 H0 Z" fill="#21262d" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 0 V5 H14" fill="none" stroke="#6e7681" stroke-width="1.3" stroke-linejoin="round"/></g>
    <text x="80" y="161" fill="#8b949e" font-size="14">authentication.md</text>

    <text x="120" y="230" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Your documents</text>
    <text x="120" y="252" text-anchor="middle" fill="#8b949e" font-size="13">markdown, notes, anything text</text>
  </g>

  <!-- arrow A->B -->
  <g>
    <text x="398" y="224" text-anchor="middle" fill="#58a6ff" font-size="14">cosmos-fs ingest</text>
    <path d="M322 238 H478" stroke="#1f6feb" stroke-width="2.6" fill="none" marker-end="url(#harr)"/>
  </g>

